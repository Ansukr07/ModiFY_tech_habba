<text x="60" y="73" font-family="Arial" font-size="46" font-weight="700" fill="#92D050">APPLICATION AND SERVICE FLOW</text>
<text x="60" y="117" font-family="Arial" font-size="23" font-weight="400" fill="#B5C2D2">Implemented prototype  /  Read left to right, then continue on the next row</text>
<text x="60" y="183" font-family="Arial" font-size="22" font-weight="700" fill="#92D050">01  REQUEST AND ACCESS</text>
