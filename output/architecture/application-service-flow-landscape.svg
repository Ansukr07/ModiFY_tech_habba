<text x="79" y="838" font-family="Arial" font-size="20" font-weight="400" fill="#E9EEF5">Update latest decision and status</text>
<text x="79" y="867" font-family="Arial" font-size="20" font-weight="400" fill="#E9EEF5">Cache idempotent API response</text>
