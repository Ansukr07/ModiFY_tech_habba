<text x="79" y="574" font-family="Arial" font-size="20" font-weight="400" fill="#E9EEF5">History + rolling four-week net</text>
<text x="79" y="603" font-family="Arial" font-size="20" font-weight="400" fill="#E9EEF5">Concentration + evidence signals</text>
