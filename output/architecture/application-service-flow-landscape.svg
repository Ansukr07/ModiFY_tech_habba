<text x="60" y="1008" font-family="Arial" font-size="23" font-weight="400" fill="#B5C2D2">Demo rails are simulated. Active scoring: heuristic-v0. The agent endpoint currently runs ordinary scoring.</text>
<text x="60" y="1039" font-family="Arial" font-size="23" font-weight="400" fill="#B5C2D2">Python service authentication is not implemented. Side-path boxes describe branches, not extra approval steps.</text>
